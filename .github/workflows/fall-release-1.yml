name: Fall Release 1 verification
on:
  pull_request:
    branches: [feat/feasibility-demo]
    paths-ignore: ['docs/**', 'README.md']
permissions:
  contents: read
concurrency:
  group: fall-release-1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: frontdesk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: .
      QUESTION_MODE: demo
      DRAFT_AI_ENABLED: '0'
      XAI_API_KEY: ''
      XAI_MODEL: ''
      AI_CALL_LIMIT: '10'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned application and browser dependencies
        run: |
          python -m pip install -r requirements.txt playwright==1.56.0
          python -m playwright install --with-deps chromium
          npm ci --prefix frontend --no-audit --no-fund
      - name: Backend regressions with mocked providers and SQLite
        run: python -m unittest discover -s tests -v
      - name: Complete frontend interaction tests
        run: npm test --prefix frontend
      - name: Strict frontend production build
        run: npm run build --prefix frontend
      - name: Additive migrations on disposable PostgreSQL, not Supabase
        env:
          DATABASE_URL: postgresql://postgres:ci-synthetic-only@127.0.0.1:5432/frontdesk_test
        run: |
          python -c "import os,psycopg; c=psycopg.connect(os.environ['DATABASE_URL'],autocommit=True); c.execute('CREATE ROLE anon'); c.execute('CREATE ROLE authenticated'); c.close()"
          python -m backend.verify_integration --database-only --apply-pending
          python -m backend.verify_integration --database-only --apply-pending
      - name: Rendered Chromium vehicle workflow with mocked Auth and AI
        run: python scripts/check-browser.py
      - name: Rendered Chromium three-business rehearsal
        run: |
          python -m scripts.rehearse >/tmp/rehearsal.log 2>&1 &
          rehearsal_pid=$!
          trap 'kill "$rehearsal_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8002/health >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          python scripts/check-business-browser.py
      - name: Diff whitespace
        run: git diff --check
